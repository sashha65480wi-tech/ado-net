services:
  db:
    image: postgres:16-alpine
    container_name: my-ado-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: my-ado-app
    restart: unless-stopped
    environment:
      POSTGRES_CONNECTION: Host=db;Port=5432;Database=appdb;Username=appuser;Password=supersecret
    ports:
      - "8089:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
